name: CI

on:
  pull_request:
    branches: [main]
  # Keep main verifiable even when a change lands without a PR (branch
  # protection can be disabled by the owner; see docs/ai/STATUS.md).
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    # Observational first: keep it visible without blocking while the baseline
    # is triaged. Promote to blocking once the report is clean for two weeks.
    continue-on-error: true
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 🔐 Audit locked dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.lock

  changes:
    name: 🔎 Change Detection
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.backend-filter.outputs.backend_non_web == 'true' || steps.filter.outputs.backend_contract_assets == 'true' || steps.filter.outputs.backend_web_contract == 'true' }}
      docker: ${{ steps.filter.outputs.docker }}
      frontend: ${{ steps.frontend-filter.outputs.frontend_code }}
      futu_packaging: ${{ steps.filter.outputs.futu_packaging }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🧭 Filter paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          predicate-quantifier: every
          filters: |
            backend_contract_assets:
              # These docs and fixtures are executable contracts consumed by
              # offline backend tests, so Markdown/docs-only changes still run them.
              - '{THIRD_PARTY_NOTICES.md,docs/CHANGELOG.md,docs/INDEX.md,docs/INDEX_EN.md,docs/DEPLOY.md,docs/DEPLOY_EN.md,docs/alerts.md,docs/analysis-context-pack.md,docs/decision-signals.md,docs/full-guide.md,docs/full-guide_EN.md,docs/notifications.md,docs/architecture/**,docs/docker/zeabur-deployment.md,tests/fixtures/**}'
            backend_web_contract:
              # Public assets are shared runtime inputs: Python loaders and
              # packaged deployments may consume them outside the Web app.
              - '{apps/dsa-web/public/**,apps/dsa-web/src/components/settings/llmProviderTemplates.ts,apps/dsa-web/src/locales/settingsHelp.ts}'
              - '!**/*.md'
            docker:
              - '{*.py,api/**,bot/**,data_provider/**,src/**,strategies/**,apps/dsa-web/**,docker/**,requirements.txt,.dockerignore,.github/workflows/ci.yml}'
              - '!**/*.md'
            futu_packaging:
              - '{requirements.txt,main.py,src/brokers/futu/**,scripts/build-backend.ps1,scripts/build-backend-macos.sh,scripts/macos-signature-audit.sh,scripts/build-all.ps1,scripts/build-all-macos.sh,apps/dsa-desktop/**,.github/workflows/ci.yml,.github/workflows/desktop-release.yml}'
              - '!**/*.md'
      - name: 🧭 Filter backend-safe frontend paths
        id: backend-filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          predicate-quantifier: every
          filters: |
            backend_non_web:
              - '**'
              - '!apps/dsa-web/**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'
      - name: 🧭 Filter frontend code paths
        id: frontend-filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          predicate-quantifier: every
          filters: |
            frontend_code:
              - 'apps/dsa-web/**'
              - '!**/*.md'

  ai-governance:
    name: ai-governance
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 🤖 Check AI governance assets
        run: python scripts/check_ai_assets.py
      - name: 🗺️ Check codemap is up to date
        run: python scripts/gen_ai_codemap.py --check

  backend-tests:
    name: backend-tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: [changes, ai-governance]
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if python -m pip install -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
      - name: 🔌 Verify global Futu SDK
        if: matrix.shard == 1
        run: python -c "import futu; print('✅ futu SDK import OK')"
      - name: ✅ Python syntax check
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh syntax
      - name: ✅ Flake8 critical checks
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh flake8
      - name: ✅ Local deterministic checks
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh deterministic
      - name: ✅ Offline test suite shard ${{ matrix.shard }}/3
        env:
          PYTEST_SPLITS: '3'
          PYTEST_GROUP: ${{ matrix.shard }}
          PYTEST_FIRST_SHARD_OVERHEAD: '20'
        run: ./scripts/ci_gate.sh offline-tests

  offline-network-guard:
    name: offline-network-guard
    runs-on: ubuntu-latest
    needs: [changes, ai-governance]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements-ci.txt
      - name: 🚫 Enforce offline sockets on core paths
        env:
          DSA_OFFLINE_GUARD: enforce
        run: |
          python -m pytest -q \
            tests/test_auth.py tests/test_auth_api.py tests/test_auth_login_log_api.py \
            tests/test_auth_setup_token.py tests/test_auth_status_setup_state.py \
            tests/test_config_manager.py tests/test_config_registry.py \
            tests/test_report_html_renderer.py tests/test_history_report_html_api.py \
            tests/test_parse_import_api.py tests/test_search_url_guard.py \
            tests/test_network_guard.py

  backend-gate:
    name: backend-gate
    runs-on: ubuntu-latest
    needs: [changes, ai-governance, backend-tests, offline-network-guard]
    if: always()
    steps:
      - name: ✅ Summarize backend gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AI_GOVERNANCE_RESULT: ${{ needs.ai-governance.result }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
          OFFLINE_GUARD_RESULT: ${{ needs.offline-network-guard.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ] || [ "$AI_GOVERNANCE_RESULT" != "success" ]; then
            echo "Prerequisite failed: changes=$CHANGES_RESULT ai-governance=$AI_GOVERNANCE_RESULT" >&2
            exit 1
          fi
          if [ "$BACKEND_REQUIRED" = "true" ] && [ "$BACKEND_TESTS_RESULT" != "success" ]; then
            echo "Backend shards did not all pass: $BACKEND_TESTS_RESULT" >&2
            exit 1
          fi
          if [ "$BACKEND_REQUIRED" = "true" ] && [ "$OFFLINE_GUARD_RESULT" != "success" ]; then
            echo "Offline network guard failed: $OFFLINE_GUARD_RESULT" >&2
            exit 1
          fi
          echo "backend-gate passed (required=$BACKEND_REQUIRED, shards=$BACKEND_TESTS_RESULT)"

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: [changes, ai-governance]
    if: needs.changes.outputs.docker == 'true'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: 🐳 Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: '7'
        with:
          context: .
          file: docker/Dockerfile
          tags: stock-analysis:test
          load: true
          cache-from: type=gha,scope=stock-analysis-ci-docker
          cache-to: type=gha,mode=max,scope=stock-analysis-ci-docker,ignore-error=true
      - name: 🐳 Docker smoke
        run: docker run --rm stock-analysis:test python -c "print('✅ Docker OK')"
      - name: 🔍 Docker smoke imports
        run: |
          docker run --rm stock-analysis:test python -c "
          from src.config import get_config; print('✅ config')
          from src.storage import DatabaseManager; print('✅ storage')
          from src.notification import NotificationService; print('✅ notification')
          from data_provider import DataFetcherManager; print('✅ data_provider')
          from src.analyzer import GeminiAnalyzer; print('✅ analyzer')
          from src.patches.eastmoney_patch import eastmoney_patch; print('✅ patch')
          from bot.dispatcher import CommandDispatcher; print('✅ bot')
          from api.app import app; print('✅ api')
          import futu; print('✅ futu')
          print('✅ All Docker imports OK')
          "

  desktop-futu-package-windows:
    name: desktop-futu-package-windows
    runs-on: windows-latest
    needs: [changes, ai-governance]
    if: needs.changes.outputs.futu_packaging == 'true'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dsa-web/package-lock.json
      - name: 📦 Install Web dependencies
        shell: pwsh
        run: npm ci --prefix apps/dsa-web
      - name: 🧊 Build and verify frozen backend
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-backend.ps1

  desktop-futu-package-macos:
    name: desktop-futu-package-macos
    runs-on: macos-15
    needs: [changes, ai-governance]
    if: needs.changes.outputs.futu_packaging == 'true'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dsa-web/package-lock.json
      - name: 📦 Install Web dependencies
        run: npm ci --prefix apps/dsa-web
      - name: 🧊 Build and verify frozen backend
        run: bash scripts/build-backend-macos.sh
      - name: 📦 Build and verify unsigned desktop package
        run: bash scripts/build-desktop-macos.sh

  web-gate:
    name: web-gate
    runs-on: ubuntu-24.04
    needs: [changes, ai-governance]
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dsa-web/package-lock.json
      - name: 📦 Install
        run: npm ci
      - name: 🔎 Lint
        run: npm run lint
      - name: 🧪 Unit tests
        # ChatPage has 3 pre-existing stale follow-up-context assertions
        # (tracked as T76 in .claude/reviews/full-repo-audit-tasks-20261121.md);
        # keep the rest of the suite blocking until that file is updated.
        run: npm test -- --exclude 'src/pages/__tests__/ChatPage.test.tsx'
      - name: 🏗️ Build
        run: npm run build
      - name: 📦 Check first-screen bundle
        # Fails when the entry preloads lazy-only libraries (export, charts,
        # markdown); such regressions only show up in the built output.
        run: python3 ../../scripts/check_static_assets.py ../../static
      - name: 🌐 Install fixture browser
        run: npx playwright install --with-deps chromium
      - name: 🧪 Verify default smoke without backend credentials
        env:
          DSA_WEB_SMOKE_PASSWORD: ''
        run: npm run test:smoke
      - name: 📸 Verify deterministic UI fixtures
        run: npx playwright test --config playwright.fixture.config.ts
      - name: 📎 Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-evidence-${{ github.event.pull_request.head.sha }}
          path: apps/dsa-web/test-results/fixtures/
          if-no-files-found: warn
          retention-days: 7
